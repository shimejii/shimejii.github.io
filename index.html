<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="main.css">
        <title>おいたまのプロフィールページです。</title>
    </head>
    <body>
        <header>
            <h1>おいたまのプロフィールサイトです</h1>
        </header>
        <main>
            <section>
                <h2>🍄自己紹介</h2>
                <div class="profile">
                    <div class="profile-img">
                        <img alt="ここにプロフィール画像を入れる予定" src="https://www.gravatar.com/avatar/e35a99514569f3149105c2a178c9e9d0?s=200 ">
                    </div>
                    <div class="description">
                        <p>
                            SI業界でシステムエンジニアとして勤務しています。<br>
                            既存システムの運用・改善に携わる中で、より「ものづくり」に近い領域への関心が強まり、
                            現在はインフラおよびアプリケーションの設計・構築領域への関わり方を模索しています。
                        </p>
                    </div>
                </div>
            </section>
            <section>
                <h2>🏆資格</h2>
                <div class="circle-select">
                    <input type="radio" id="opt1" name="sort" checked>
                    <label for="opt1">取得年月</label>

                    <input type="radio" id="opt2" name="sort">
                    <label for="opt2">名前</label>
                </div>
                <div class="yazirushi">
                    <div class="line01"></div>
                    <div class="line02"></div>
                </div>
                <div class="certification">
                    <!-- javascriptから挿入予定 -->
                </div>

            </section>
            <section class="timeline-section">
                <h2>🧑‍💻経歴</h2>
                <div class="timeline">
                    <div class="career-list">
                        <div class="career">2025/07~ ServiceNow 維持保守</div>
                        <div class="career">????</div>
                    </div>
                </div>
            </section>
        </main>
        <script src="main.js"></script>
    </body>
</html>
